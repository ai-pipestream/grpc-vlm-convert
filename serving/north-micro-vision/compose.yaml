# One service per accelerator; bring up exactly one:
#   docker compose -f compose.yaml --profile cuda up -d --build
#   docker compose -f compose.yaml --profile xpu  up -d --build   (Intel Arc / Battlemage host)
#   docker compose -f compose.yaml --profile cpu  up -d --build
# Weights (about 5 GB) download once into the hf-cache volume.
#
# The port is published on 127.0.0.1 only: whoever reaches it gets the GPU.
# To serve other hosts, set NORTH_PUBLISH_ADDRESS (0.0.0.0, or one
# interface's address) and NORTH_API_KEY together, e.g.
#   NORTH_PUBLISH_ADDRESS=0.0.0.0 NORTH_API_KEY=... docker compose ... up -d
# and give the same key to the clients (GRPC_VLM_API_KEY for
# grpc-vlm-convert).
services:
  north-cuda:
    profiles: [cuda]
    build: { context: ., dockerfile: Dockerfile.cuda }
    image: pipestreamai/north-micro-vision:cuda
    ports: ["${NORTH_PUBLISH_ADDRESS:-127.0.0.1}:8086:8080"]
    environment:
      NORTH_API_KEY: "${NORTH_API_KEY:-}"
    volumes: [hf-cache:/hf]
    gpus: all
    restart: unless-stopped
  north-xpu:
    profiles: [xpu]
    build: { context: ., dockerfile: Dockerfile.xpu }
    image: pipestreamai/north-micro-vision:xpu
    ports: ["${NORTH_PUBLISH_ADDRESS:-127.0.0.1}:8086:8080"]
    environment:
      NORTH_API_KEY: "${NORTH_API_KEY:-}"
    volumes: [hf-cache:/hf]
    devices: ["/dev/dri:/dev/dri"]
    restart: unless-stopped
  north-cpu:
    profiles: [cpu]
    build: { context: ., dockerfile: Dockerfile.cpu }
    image: pipestreamai/north-micro-vision:cpu
    ports: ["${NORTH_PUBLISH_ADDRESS:-127.0.0.1}:8086:8080"]
    environment:
      NORTH_API_KEY: "${NORTH_API_KEY:-}"
    volumes: [hf-cache:/hf]
    restart: unless-stopped
volumes:
  hf-cache:

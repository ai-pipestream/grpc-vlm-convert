// grpc-vlm-convert wire contract: alternate page parse by a vision-language
// model (Granite-Docling / SmolDocling class), mapping the model response
// (DocTags / markdown / HTML / OTSL / plaintext) into the gRParse Document
// data plane. The VLM itself lives in a separate server (llama.cpp, vLLM
// OpenAI-compat, OVMS, KServe v2); this process is a CPU-bound mapper and
// HTTP client — it never loads model weights.
syntax = "proto3";

package ai.pipestream.vlm.v1;

import "ai/pipestream/document/v1/document.proto";

// Streaming VLM page-parse collector.
//
// The product is the live event stream: a PageDocument is emitted the
// moment that page's VLM call returns, in completion order (pages may
// finish out of order; every event carries its page_no). ConvertComplete
// is a trailer with counts, not the payload. A UI paints each page as it
// arrives; the coordinator merges fragments keyed on page_no.
service VlmConvertService {
  // Bidirectional page-conversion stream.
  //
  // The client sends exactly one ConvertOptions as the first message, then
  // one PageImage per page (the preferred path — the caller already
  // rendered PNGs) or PdfChunk messages for the server-side rasterize
  // fallback, then half-closes. The server replies with PageStarted as
  // each page enters the model queue, PageDocument (or PageRaw when
  // mapping fails or the endpoint errors) in completion order, and a
  // single ConvertComplete trailer. Pages are admitted as they fit the
  // server's buffer budgets, so a client sending faster than the model
  // answers is held back by flow control. Those budgets count input bytes
  // only: converted pages wait in server memory, unbounded, until the
  // client reads them, so read responses while uploading.
  //
  // Errors: no endpoint configured (and no per-request override) is
  // FAILED_PRECONDITION; an endpoint override the server does not allow
  // is PERMISSION_DENIED; pages above the byte or page-count cap are
  // RESOURCE_EXHAUSTED; malformed input (missing options, non-PNG page
  // bytes, a page_no of zero or above 2147483647) is INVALID_ARGUMENT;
  // PDF input without a rasterizer built in is UNIMPLEMENTED.
  rpc ConvertPages(stream ConvertPagesRequest) returns (stream ConvertPagesResponse);

  // Reports the server build, the configured endpoint's scheme, host and
  // port, and which presets that endpoint claims to serve. Never triggers
  // a model download.
  rpc GetServiceInfo(GetServiceInfoRequest) returns (GetServiceInfoResponse);
}

// One client-to-server message on the ConvertPages stream.
message ConvertPagesRequest {
  // Exactly one payload kind per message.
  oneof payload {
    // Must be the first message on the stream and must not repeat.
    ConvertOptions options = 1;
    // One rendered page. Pages may arrive in any order keyed by page_no.
    PageImage page_image = 2;
    // A chunk of an encoded PDF, in file order (fallback input; the server
    // rasterizes when it has a rasterizer built in).
    PdfChunk pdf_chunk = 3;
  }
}

// Per-stream conversion options, sent once as the first message.
message ConvertOptions {
  // Model preset, mirroring Docling's VlmModelType vocabulary. Combined
  // with preset_raw for open vocabularies: set preset to
  // VLM_PRESET_RAW and put the endpoint's model name in preset_raw.
  VlmPreset preset = 1;

  // Free-form model name, forwarded verbatim to the endpoint when preset
  // is VLM_PRESET_RAW. Unknown names are never validated locally — the
  // endpoint answers.
  string preset_raw = 2;

  // Response format the mapper should expect. Unspecified means the
  // preset's default (DocTags for SmolDocling / Granite-Docling, markdown
  // otherwise).
  ResponseFormat response_format = 3;

  // Prompt override. Empty means the preset's default prompt.
  string prompt = 4;

  // Page raster scale hint. The coordinator honors this when it is the
  // renderer; this server only records it when the caller already sent
  // PNGs. Zero means the server default.
  double scale = 5;

  // Per-request endpoint override: an http:// base (/v1/chat/completions
  // is appended; after a /v1 base only /chat/completions) or a full
  // .../chat/completions URL, used as is. Empty means the configured
  // server endpoint. Any other value is refused with PERMISSION_DENIED
  // unless the operator allows overrides, and an override never receives
  // the server's API key. When both are empty the RPC fails with
  // FAILED_PRECONDITION.
  string endpoint = 6;

  // Pages in flight against the VLM for this stream. Zero means the
  // server default; values above the configured maximum are clamped. All
  // streams together are also held to the server's own in-flight cap.
  uint32 concurrency = 7;

  // When true, a single page failure fails the whole stream: pages not
  // yet sent to the model are skipped and calls in flight are cut.
  // Default false: a failed page produces a PageRaw error event and the
  // rest of the document still converts.
  bool abort_on_error = 8;

  // Ask the endpoint for the N best alternates per generated token. They
  // reach the fragment as the body group's alternatives meta, in
  // generation order, which is the only route to n-best readings and
  // costs no extra model call. Zero, the default, asks for none. The
  // ceiling is 20, the limit OpenAI-compatible endpoints impose; above it
  // the RPC fails INVALID_ARGUMENT. A long page times N alternates is a
  // lot of hypotheses, so ask only when something downstream reads them.
  uint32 top_logprobs = 9;
}

// Vision-language model presets, mirroring Docling's VlmModelType.
enum VlmPreset {
  // Defaults to VLM_PRESET_GRANITE_DOCLING.
  VLM_PRESET_UNSPECIFIED = 0;
  // HuggingFaceTB SmolDocling; DocTags output.
  VLM_PRESET_SMOLDOCLING = 1;
  // IBM Granite-Docling (258M class); DocTags output.
  VLM_PRESET_GRANITE_DOCLING = 2;
  // GOT-OCR-2.0.
  VLM_PRESET_GOT_OCR_2 = 3;
  // IBM Granite Vision (non-Docling); markdown output.
  VLM_PRESET_GRANITE_VISION = 4;
  // DeepSeek-OCR; markdown output.
  VLM_PRESET_DEEPSEEK_OCR = 5;
  // Nanonets-OCR2; markdown output.
  VLM_PRESET_NANONETS_OCR2 = 6;
  // GLM-OCR; markdown output.
  VLM_PRESET_GLM_OCR = 7;
  // LightOnOCR; markdown output.
  VLM_PRESET_LIGHTON_OCR = 8;
  // Open vocabulary: preset_raw carries the endpoint's model name
  // (Unlimited-OCR, Dolphin, Chandra, dots.ocr, ...).
  VLM_PRESET_RAW = 9;
  // Cohere Labs North Micro Vision Instruct (2.4B, Apache 2.0), the open
  // base of Cohere's document parser; markdown output.
  VLM_PRESET_NORTH_MICRO_VISION = 10;
}

// Model response formats this service can map into Document items.
enum ResponseFormat {
  // The preset's default format.
  RESPONSE_FORMAT_UNSPECIFIED = 0;
  // Docling DocTags with <loc_*> locations; the only format carrying
  // real per-item bounding boxes.
  RESPONSE_FORMAT_DOCTAGS = 1;
  // Markdown; headings, lists, fenced code, and pipe tables map to
  // labeled items with page-level provenance only.
  RESPONSE_FORMAT_MARKDOWN = 2;
  // HTML snippet; tags map to labeled items with page-level provenance.
  RESPONSE_FORMAT_HTML = 3;
  // OTSL table markup; maps to a single table item.
  RESPONSE_FORMAT_OTSL = 4;
  // Unstructured text; one TextItem per page.
  RESPONSE_FORMAT_PLAINTEXT = 5;
}

// One rendered page, PNG-encoded, as the coordinator's CV path already
// produces. Sending these avoids a second rasterizer in this process.
message PageImage {
  // PNG-encoded page raster.
  bytes png = 1;
  // 1-based page number, at most 2147483647 (the Document keys pages as
  // int32). Events key on this; out-of-order is legal.
  uint32 page_no = 2;
  // Raster width in pixels, used to scale DocTags locations to pixels.
  uint32 width = 3;
  // Raster height in pixels, used to scale DocTags locations to pixels.
  uint32 height = 4;
}

// A chunk of an encoded PDF (fallback input style).
message PdfChunk {
  // Raw bytes of the PDF file, in order.
  bytes data = 1;
}

// One server-to-client event on the ConvertPages stream.
message ConvertPagesResponse {
  // Exactly one event kind per message.
  oneof event {
    // A page entered the model queue: emitted when the server admits it
    // (its bytes fit the stream's and the server's buffer budgets), before
    // its VLM call starts.
    PageStarted page_started = 1;
    // A converted page: a Document fragment carrying that page's items,
    // pictures, and tables with page provenance.
    PageDocument page_document = 2;
    // Fallback for a page: the model's raw text when mapping failed, or
    // an error when the endpoint failed. Never both absent.
    PageRaw page_raw = 3;
    // Trailer: aggregate counts for the finished stream.
    ConvertComplete complete = 4;
  }
}

// A page entered the model queue.
message PageStarted {
  // 1-based page number that started.
  uint32 page_no = 1;
}

// A converted page as a Document fragment. Fragments merge with the same
// additive rules as other collectors; items carry a CollectorSource
// ("vlm-convert", the model name, this server's version) and a
// GenerationSource naming the model that answered, the endpoint, the stop
// reason, and the token usage of the call that produced the page.
message PageDocument {
  // 1-based page number this fragment belongs to.
  uint32 page_no = 1;
  // The page's items. DocTags responses carry real bounding boxes;
  // markdown/HTML/plaintext responses carry the full-page box only.
  ai.pipestream.document.v1.Document document = 2;
  // Where the fragment is less than the model's answer: something cut to
  // a server cap rather than mapped whole. Empty when nothing was cut.
  repeated PageWarning warnings = 3;
}

// One place a converted page is less than the model's answer, reported
// beside its fragment.
message PageWarning {
  // Which cap was hit.
  PageWarningCode code = 1;
  // Human-readable detail with the numbers involved; never the sole
  // carrier of meaning.
  string message = 2;
  // Ref of the item the warning is about, in the fragment's own ref space
  // ("#/tables/0", "#/pictures/3"); empty when it covers the whole page.
  string ref = 3;
}

// What a page can lose to a server cap.
enum PageWarningCode {
  // Not set. Never emitted by the server.
  PAGE_WARNING_CODE_UNSPECIFIED = 0;
  // A table, or a chart's data table, held more rows, columns or cells
  // than the server maps (a model repeating itself can emit millions);
  // the item keeps the leading rows and columns that fit.
  PAGE_WARNING_CODE_TABLE_TRUNCATED = 1;
  // A table's grid (each cell copied onto every position its span covers)
  // would have cost more than the server spends on one, through
  // overlapping spans or long spanned text; the item keeps its cells and
  // an empty grid.
  PAGE_WARNING_CODE_TABLE_GRID_OMITTED = 2;
  // Pictures carry no image because a crop cap refused them: the page's
  // crop budget ran out (a model repeating a picture asks for many), or
  // the page raster is larger than the server decodes. Every PictureItem
  // is still there.
  PAGE_WARNING_CODE_PICTURE_IMAGES_SKIPPED = 3;
}

// Unmapped model output or a page failure.
message PageRaw {
  // 1-based page number.
  uint32 page_no = 1;
  // The model's raw response text, when the call succeeded but mapping
  // failed. Empty on endpoint failure.
  string text = 2;
  // What went wrong, when this event reports a failure (endpoint error,
  // or the mapping failure reason alongside text). Empty when unset.
  string error = 3;
}

// Trailer summarizing the finished conversion.
message ConvertComplete {
  // Total pages that entered the model queue.
  uint32 pages_started = 1;
  // Pages that produced a PageDocument.
  uint32 pages_ok = 2;
  // Pages that produced a PageRaw (mapping failure or endpoint error).
  uint32 pages_failed = 3;
}

// Request for GetServiceInfo. Empty by design.
message GetServiceInfoRequest {}

// Build and capability facts for this server process.
message GetServiceInfoResponse {
  // Semantic version of this server build.
  string version = 1;
  // Configured VLM endpoint as scheme, host and port only, e.g.
  // "http://vlm:8080": a path, query or credentials it carries are never
  // reported. Empty when none is configured.
  string endpoint = 2;
  // Built-in presets the configured endpoint claims to serve.
  repeated VlmPreset presets = 3;
  // Raw model names the configured endpoint claims to serve, beyond the
  // built-in vocabulary.
  repeated string raw_presets = 4;
  // Maximum pages in flight against the VLM per stream.
  uint32 concurrency = 5;
  // Maximum accepted PNG size per page in bytes; larger pages fail with
  // RESOURCE_EXHAUSTED.
  uint64 max_page_bytes = 6;
  // Maximum pages per stream; more pages fail with RESOURCE_EXHAUSTED.
  uint32 max_pages = 7;
  // Frontend advertisement for the shared demo shell.
  UiInfo ui = 8;
}

// Frontend advertisement. Same shape in every ai-pipestream grpc service:
// the demo shell reads it to build its tab bar.
message UiInfo {
  // Tab title, e.g. "VLM Convert".
  string title = 1;
  // Shell mount path, e.g. "/ui/vlm-convert".
  string path = 2;
  // One line, used as the tab tooltip.
  string description = 3;
}

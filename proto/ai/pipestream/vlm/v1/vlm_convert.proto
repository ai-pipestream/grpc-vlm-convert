// grpc-vlm-convert wire contract: alternate page parse by a vision-language
// model (Granite-Docling / SmolDocling class), mapping the model response
// (DocTags / markdown / HTML / OTSL / plaintext) into the gRParse Document
// data plane. The VLM itself lives in a separate server (llama.cpp, vLLM
// OpenAI-compat, OVMS, KServe v2); this process is a CPU-bound mapper and
// HTTP client — it never loads model weights.
syntax = "proto3";

package ai.pipestream.vlm.v1;

import "ai/pipestream/document/v1/document.proto";

// Streaming VLM page-parse collector.
//
// The product is the live event stream: a PageDocument is emitted the
// moment that page's VLM call returns, in completion order (pages may
// finish out of order; every event carries its page_no). ConvertComplete
// is a trailer with counts, not the payload. A UI paints each page as it
// arrives; the coordinator merges fragments keyed on page_no.
service VlmConvertService {
  // Bidirectional page-conversion stream.
  //
  // The client sends exactly one ConvertOptions as the first message, then
  // one PageImage per page (the preferred path — the caller already
  // rendered PNGs) or PdfChunk messages for the server-side rasterize
  // fallback, then half-closes. The server replies with PageStarted as
  // each page enters the model queue, PageDocument (or PageRaw when
  // mapping fails or the endpoint errors) in completion order, and a
  // single ConvertComplete trailer. Pages are admitted as they fit the
  // server's buffer budgets, so a client sending faster than the model
  // answers is held back by flow control. Those budgets count input bytes
  // only: converted pages wait in server memory, unbounded, until the
  // client reads them, so read responses while uploading.
  //
  // Errors: no endpoint configured (and no per-request override) is
  // FAILED_PRECONDITION; an endpoint override the server does not allow
  // is PERMISSION_DENIED; pages above the byte or page-count cap are
  // RESOURCE_EXHAUSTED; malformed input (missing options, non-PNG page
  // bytes, a page_no of zero or above 2147483647) is INVALID_ARGUMENT;
  // PDF input without a rasterizer built in is UNIMPLEMENTED. A stream
  // where no page converted and every page failed at the endpoint (it
  // could not be reached, it timed out, or it answered with an HTTP
  // error) ends UNAVAILABLE after its PageRaw events and its trailer:
  // nothing was converted, and the status must not say otherwise.
  rpc ConvertPages(stream ConvertPagesRequest) returns (stream ConvertPagesResponse);

  // Reports the server build, the configured endpoint's scheme, host and
  // port, and which presets that endpoint claims to serve. Never triggers
  // a model download.
  rpc GetServiceInfo(GetServiceInfoRequest) returns (GetServiceInfoResponse);
}

// One client-to-server message on the ConvertPages stream.
message ConvertPagesRequest {
  // Exactly one payload kind per message.
  oneof payload {
    // Must be the first message on the stream and must not repeat.
    ConvertOptions options = 1;
    // One rendered page. Pages may arrive in any order keyed by page_no.
    PageImage page_image = 2;
    // A chunk of an encoded PDF, in file order (fallback input; the server
    // rasterizes when it has a rasterizer built in).
    PdfChunk pdf_chunk = 3;
  }
}

// Per-stream conversion options, sent once as the first message.
message ConvertOptions {
  // Model preset, mirroring Docling's VlmModelType vocabulary. Combined
  // with preset_raw for open vocabularies: set preset to
  // VLM_PRESET_RAW and put the endpoint's model name in preset_raw.
  VlmPreset preset = 1;

  // Free-form model name, forwarded verbatim to the endpoint when preset
  // is VLM_PRESET_RAW. Unknown names are never validated locally — the
  // endpoint answers.
  string preset_raw = 2;

  // Response format the mapper should expect. Unspecified means the
  // preset's default (DocTags for SmolDocling / Granite-Docling, markdown
  // otherwise).
  ResponseFormat response_format = 3;

  // Prompt override. Empty means the preset's default prompt.
  string prompt = 4;

  // Page raster scale hint. The coordinator honors this when it is the
  // renderer; this server only records it when the caller already sent
  // PNGs. Zero means the server default.
  double scale = 5;

  // Per-request endpoint override: an http:// base (/v1/chat/completions
  // is appended; after a /v1 base only /chat/completions) or a full
  // .../chat/completions URL, used as is. Empty, or any spelling of the
  // configured endpoint that reaches the same URL (host case, a default
  // port, trailing slashes), means the configured server endpoint. Any
  // other value is refused with PERMISSION_DENIED unless the operator
  // allows overrides, and an override never receives the server's API
  // key. When both are empty the RPC fails with FAILED_PRECONDITION.
  string endpoint = 6;

  // Pages in flight against the VLM for this stream. Zero means the
  // server default; values above the configured maximum are clamped. All
  // streams together are also held to the server's own in-flight cap.
  uint32 concurrency = 7;

  // When true, a single page failure fails the whole stream: pages not
  // yet sent to the model are skipped and calls in flight are cut.
  // Default false: a failed page produces a PageRaw error event and the
  // rest of the document still converts.
  bool abort_on_error = 8;

  // Ask the endpoint for the N best alternates per generated token. They
  // reach the fragment as the body group's alternatives meta, in
  // generation order, which is the only route to n-best readings and
  // costs no extra model call. Zero, the default, asks for none. The
  // ceiling is 20, the limit OpenAI-compatible endpoints impose; above it
  // the RPC fails INVALID_ARGUMENT. A long page times N alternates is a
  // lot of hypotheses, so ask only when something downstream reads them.
  uint32 top_logprobs = 9;

  // docling's ResponseFormat string value ("nemotron_parse_v3_5"), for a
  // client that forwards docling options verbatim. Empty means unset. It
  // must name a docling format, and with response_format set both must
  // name the same one; otherwise the RPC fails INVALID_ARGUMENT before a
  // page is read. When response_format is unset this selects the format.
  string response_format_raw = 10;

  // docling's NemotronParseOptions. Read only with the nemotron_parse_v3_5
  // response format; a double or triple pass with any other format fails
  // INVALID_ARGUMENT. Unset means the single page pass.
  NemotronParseOptions nemotron_parse = 11;
}

// How Nemotron Parse 3.5 reads a page, mirroring docling's
// NemotronParseOptions. A double or triple pass parses each Table and
// Chart region again from a crop and keeps the crop's text only where its
// structure checks out, so a page costs one call per region more. It
// cannot be combined with top_logprobs: the merged page text is not text
// the model generated, so it has no token alternates (INVALID_ARGUMENT).
message NemotronParseOptions {
  // Unspecified is the single pass.
  NemotronParsePasses passes = 1;
  // Which regions a triple pass crops. Unspecified is union.
  NemotronParseTripleRegions triple_regions = 2;
  // Crop calls sent together for one page; zero means docling's default
  // of 8. They also count against the server's in-flight cap: a crop runs
  // beside the page's own call only on a slot that is free.
  uint32 crop_batch_size = 3;
}

// docling's NemotronParseOptions.passes.
enum NemotronParsePasses {
  // The single pass.
  NEMOTRON_PARSE_PASSES_UNSPECIFIED = 0;
  // One page call; the page as the model read it.
  NEMOTRON_PARSE_PASSES_SINGLE = 1;
  // The page call, then one call per Table or Chart region it found.
  NEMOTRON_PARSE_PASSES_DOUBLE = 2;
  // The page call, a detection call that only finds regions, then one
  // call per region.
  NEMOTRON_PARSE_PASSES_TRIPLE = 3;
}

// docling's NemotronParseOptions.triple_regions.
enum NemotronParseTripleRegions {
  // Union.
  NEMOTRON_PARSE_TRIPLE_REGIONS_UNSPECIFIED = 0;
  // Only the regions the detection call found.
  NEMOTRON_PARSE_TRIPLE_REGIONS_DETECTOR = 1;
  // The detected regions, plus page call regions the detector missed.
  NEMOTRON_PARSE_TRIPLE_REGIONS_UNION = 2;
}

// Vision-language model presets, mirroring Docling's VlmModelType.
enum VlmPreset {
  // Defaults to VLM_PRESET_GRANITE_DOCLING.
  VLM_PRESET_UNSPECIFIED = 0;
  // HuggingFaceTB SmolDocling; DocTags output.
  VLM_PRESET_SMOLDOCLING = 1;
  // IBM Granite-Docling (258M class); DocTags output.
  VLM_PRESET_GRANITE_DOCLING = 2;
  // GOT-OCR-2.0.
  VLM_PRESET_GOT_OCR_2 = 3;
  // IBM Granite Vision (non-Docling); markdown output.
  VLM_PRESET_GRANITE_VISION = 4;
  // DeepSeek-OCR; markdown output.
  VLM_PRESET_DEEPSEEK_OCR = 5;
  // Nanonets-OCR2; markdown output.
  VLM_PRESET_NANONETS_OCR2 = 6;
  // GLM-OCR; markdown output.
  VLM_PRESET_GLM_OCR = 7;
  // LightOnOCR; markdown output.
  VLM_PRESET_LIGHTON_OCR = 8;
  // Open vocabulary: preset_raw carries the endpoint's model name
  // (Unlimited-OCR, Dolphin, Chandra, dots.ocr, ...).
  VLM_PRESET_RAW = 9;
  // Cohere Labs North Micro Vision Instruct (2.4B, Apache 2.0), the open
  // base of Cohere's document parser; markdown output.
  VLM_PRESET_NORTH_MICRO_VISION = 10;
}

// Model response formats, every member of docling's ResponseFormat as of
// docling 2.142.1 with the numbering gRParse's parse_types.proto uses. All
// but MINERU2 map into Document items (GetServiceInfoResponse
// response_formats lists them).
enum ResponseFormat {
  // The preset's default format.
  RESPONSE_FORMAT_UNSPECIFIED = 0;
  // Docling DocTags with <loc_*> locations; the only format carrying
  // real per-item bounding boxes.
  RESPONSE_FORMAT_DOCTAGS = 1;
  // Markdown; headings, lists, fenced code, and pipe tables map to
  // labeled items with page-level provenance only.
  RESPONSE_FORMAT_MARKDOWN = 2;
  // HTML snippet; tags map to labeled items with page-level provenance.
  RESPONSE_FORMAT_HTML = 3;
  // OTSL table markup; maps to a single table item.
  RESPONSE_FORMAT_OTSL = 4;
  // Unstructured text; one TextItem per page.
  RESPONSE_FORMAT_PLAINTEXT = 5;
  // docling "doclang": the DocLang XML vocabulary (docling-core's
  // DocLangDocDeserializer). The first <doclang>...</doclang> fragment is
  // read; <location> quartets become per-item boxes.
  RESPONSE_FORMAT_DOCLANG = 6;
  // docling "deepseekocr_markdown": DeepSeek-OCR grounding output,
  // <|ref|>label<|/ref|><|det|>[[x1, y1, x2, y2]]<|/det|> lines on a 0-1000
  // grid followed by each block's markdown or HTML table.
  RESPONSE_FORMAT_DEEPSEEKOCR_MARKDOWN = 7;
  // docling "unlimited_ocr_markdown": Unlimited-OCR grounding output,
  // <|det|>label [x1, y1, x2, y2]<|/det|> annotations read as DeepSeek-OCR.
  RESPONSE_FORMAT_UNLIMITED_OCR_MARKDOWN = 8;
  // docling "chandra_html": Chandra's HTML dialect, layout blocks carrying
  // data-label and data-bbox (0-1000 grid).
  RESPONSE_FORMAT_CHANDRA_HTML = 9;
  // docling "dots_json": dots.ocr / dots.mocr JSON layout elements
  // (bbox, category, text), boxes in the Qwen2-VL resized input space.
  RESPONSE_FORMAT_DOTS_JSON = 10;
  // docling "nemotron_parse_v2": Nemotron Parse 2.0 regions
  // <x_><y_>text<x_><y_><class_X>, boxes on the padded 1664x2048 canvas.
  RESPONSE_FORMAT_NEMOTRON_PARSE_V2 = 11;
  // docling "nemotron_parse_v3_5": Nemotron 3.5 Parse blocks, boxes
  // normalized 0-1 to the page.
  RESPONSE_FORMAT_NEMOTRON_PARSE_V3_5 = 12;
  // docling "mineru2": MinerU2's two-pass layout then per-region
  // recognition. Not served: a request naming it fails UNIMPLEMENTED
  // before a page is read, and GetServiceInfo does not advertise it.
  RESPONSE_FORMAT_MINERU2 = 13;
}

// One rendered page, PNG-encoded, as the coordinator's CV path already
// produces. Sending these avoids a second rasterizer in this process.
message PageImage {
  // PNG-encoded page raster.
  bytes png = 1;
  // 1-based page number, at most 2147483647 (the Document keys pages as
  // int32). Events key on this; out-of-order is legal.
  uint32 page_no = 2;
  // Raster width in pixels, used to scale model boxes to pixels. Zero, or
  // a zero height, means both are read from the PNG header; a page whose
  // header gives none fails as a PageRaw error.
  uint32 width = 3;
  // Raster height in pixels, used to scale model boxes to pixels.
  uint32 height = 4;
}

// A chunk of an encoded PDF (fallback input style).
message PdfChunk {
  // Raw bytes of the PDF file, in order.
  bytes data = 1;
}

// One server-to-client event on the ConvertPages stream.
message ConvertPagesResponse {
  // Exactly one event kind per message.
  oneof event {
    // A page entered the model queue: emitted when the server admits it
    // (its bytes fit the stream's and the server's buffer budgets), before
    // its VLM call starts.
    PageStarted page_started = 1;
    // A converted page: a Document fragment carrying that page's items,
    // pictures, and tables with page provenance.
    PageDocument page_document = 2;
    // Fallback for a page: the model's raw text when mapping failed, or
    // an error when the endpoint failed. Never both absent.
    PageRaw page_raw = 3;
    // Trailer: aggregate counts for the finished stream.
    ConvertComplete complete = 4;
  }
}

// A page entered the model queue.
message PageStarted {
  // 1-based page number that started.
  uint32 page_no = 1;
}

// A converted page as a Document fragment. Fragments merge with the same
// additive rules as other collectors; items carry a CollectorSource
// ("vlm-convert", the model name, this server's version) and a
// GenerationSource naming the model that answered, the endpoint, the stop
// reason, and the token usage of the call that produced the page.
message PageDocument {
  // 1-based page number this fragment belongs to.
  uint32 page_no = 1;
  // The page's items. DocTags responses carry real bounding boxes;
  // markdown/HTML/plaintext responses carry the full-page box only.
  ai.pipestream.document.v1.Document document = 2;
  // Where the fragment is less than it should be: something cut to a
  // server cap rather than mapped whole, a Nemotron Parse pass that fell
  // short, or part of the answer the mapper could not read. Empty when
  // nothing was lost.
  repeated PageWarning warnings = 3;
  // The model call that produced this page: the model that answered, the
  // endpoint origin, the stop reason verbatim and classified, the token
  // cost. The same value rides every item's source list; it is repeated
  // here so a fragment with no items still says how its answer ended.
  ai.pipestream.document.v1.GenerationSource generation = 4;
}

// One place a converted page is less than the model's answer, reported
// beside its fragment.
message PageWarning {
  // What fell short.
  PageWarningCode code = 1;
  // Human-readable detail with the numbers involved; never the sole
  // carrier of meaning.
  string message = 2;
  // Ref of the item the warning is about, in the fragment's own ref space
  // ("#/tables/0", "#/pictures/3"); empty when it covers the whole page.
  string ref = 3;
}

// What a page can lose: to a server cap, to a model call that failed or
// was cut off, or to output the mapper could not read.
enum PageWarningCode {
  // Not set. Never emitted by the server.
  PAGE_WARNING_CODE_UNSPECIFIED = 0;
  // A table, or a chart's data table, held more rows, columns or cells
  // than the server maps (a model repeating itself can emit millions);
  // the item keeps the leading rows and columns that fit.
  PAGE_WARNING_CODE_TABLE_TRUNCATED = 1;
  // A table's grid (each cell copied onto every position its span covers)
  // would have cost more than the server spends on one, through
  // overlapping spans or long spanned text; the item keeps its cells and
  // an empty grid.
  PAGE_WARNING_CODE_TABLE_GRID_OMITTED = 2;
  // Pictures carry no image because a crop cap refused them: the page's
  // crop budget ran out (a model repeating a picture asks for many), the
  // page's inline image bytes reached the server's cap (which keeps a
  // page under common client message limits), or the page raster is
  // larger than the server decodes. Every PictureItem is still there.
  PAGE_WARNING_CODE_PICTURE_IMAGES_SKIPPED = 3;
  // A Nemotron Parse double or triple pass fell short: the page call did
  // not finish (so nothing was cropped), the detection call or some region
  // crop calls failed, the raster could not be cropped, or the page held
  // more regions than the server crops. Those regions keep the page pass
  // text; the message gives the counts.
  PAGE_WARNING_CODE_NEMOTRON_PASS_INCOMPLETE = 4;
  // The model returned no text at all for the page, so the fragment has no
  // items. A model that answers with its format's own empty layout (dots.ocr
  // "[]", a Chandra Blank-Page block) declared the page empty and raises no
  // warning; an answer with text that maps to no items is a PageRaw.
  PAGE_WARNING_CODE_EMPTY_RESPONSE = 5;
  // The model's answer ended before the model was done: cut off at
  // max_tokens, or ended by the endpoint's content filter or an inference
  // error. The fragment holds what mapped from the part that arrived and
  // the rest of the page is missing. The page's generation says which:
  // its stop_reason is VLM_STOP_REASON_LENGTH,
  // VLM_STOP_REASON_CONTENT_FILTERED or VLM_STOP_REASON_INFERENCE_ERROR.
  PAGE_WARNING_CODE_GENERATION_TRUNCATED = 6;
  // The answer breaks off inside its own layout: a dots.ocr array with no
  // closing bracket after an unfinished element, a Nemotron Parse region
  // or block that opens and never closes. The fragment holds the complete
  // elements; the unfinished tail is not mapped. The message gives its
  // size in bytes.
  PAGE_WARNING_CODE_OUTPUT_TRUNCATED = 7;
  // The answer holds elements the mapper could not read and built nothing
  // from: a dots.ocr array entry that is not an object, or one with
  // neither a usable box nor text; a Nemotron Parse 3.5 block with text
  // and fewer than two corner tokens; a DocTags <link_> token whose target
  // is not a number. The message counts them.
  PAGE_WARNING_CODE_ELEMENTS_SKIPPED = 8;
  // The model wrote a location the mapper could not read: a dots.ocr
  // element whose bbox is missing or is not four numbers, a DocTags <loc_>
  // token that is not a number. The item is in the fragment with its text,
  // on the full-page box instead of its own. The message counts them.
  PAGE_WARNING_CODE_LOCATION_UNREADABLE = 9;
}

// Unmapped model output or a page failure.
message PageRaw {
  // 1-based page number.
  uint32 page_no = 1;
  // The model's raw response text, when the call succeeded but mapping
  // failed. Empty on endpoint failure.
  string text = 2;
  // What went wrong, in words: the endpoint failure, or the mapping
  // failure reason alongside text. For people and logs; error_code is the
  // value to branch on.
  string error = 3;
  // The model call behind text, when the call succeeded but mapping failed:
  // a stop reason of VLM_STOP_REASON_LENGTH says the answer was cut off,
  // which is the usual reason it no longer parses. Unset on endpoint
  // failure.
  ai.pipestream.document.v1.GenerationSource generation = 4;
  // Why the page failed, as a value a caller can branch on; error says the
  // same in words. Set on every PageRaw.
  PageErrorCode error_code = 5;
  // What the endpoint answered, when error_code is
  // PAGE_ERROR_CODE_ENDPOINT_HTTP_ERROR. Unset otherwise.
  EndpointError endpoint_error = 6;
}

// Why a page produced a PageRaw instead of a PageDocument.
enum PageErrorCode {
  // Not set. Never emitted by the server.
  PAGE_ERROR_CODE_UNSPECIFIED = 0;
  // No connection to the VLM endpoint could be made or kept, after the
  // retries the client makes.
  PAGE_ERROR_CODE_ENDPOINT_UNREACHABLE = 1;
  // The endpoint answered with an HTTP status other than 200, after the
  // retries the client makes for 429 and 5xx. endpoint_error carries the
  // status and what the endpoint said.
  PAGE_ERROR_CODE_ENDPOINT_HTTP_ERROR = 2;
  // The call did not finish within the server's per-page time budget,
  // retries included.
  PAGE_ERROR_CODE_TIMEOUT = 3;
  // The endpoint answered 200 with a body that is not a chat completion
  // carrying message content.
  PAGE_ERROR_CODE_MALFORMED_RESPONSE = 4;
  // The model answered, but not in the response format asked for, so
  // nothing could be mapped. text holds the answer verbatim.
  PAGE_ERROR_CODE_UNMAPPABLE_OUTPUT = 5;
  // The page as sent cannot be converted: it names no width or height and
  // its PNG header gives none.
  PAGE_ERROR_CODE_INVALID_PAGE = 6;
  // The server failed while converting the page, through no fault of the
  // page or the endpoint.
  PAGE_ERROR_CODE_INTERNAL = 7;
}

// The endpoint's own account of a call it refused or failed.
message EndpointError {
  // The HTTP status of the reply (the last one, when the call was
  // retried).
  uint32 http_status = 1;
  // The reply's error message: the OpenAI error object's message
  // ("error.message"), or the text other servers put in its place (an
  // "error" or "detail" string, a top-level "message", a plain-text body).
  // Empty when the reply carried none that could be read. At most 2048
  // bytes; message_truncated says when it was cut.
  string message = 2;
  // The reply's error type ("error.type", e.g. "invalid_request_error"),
  // at most 128 bytes. Empty when the reply named none.
  string type = 3;
  // True when the endpoint's message was longer than message holds.
  bool message_truncated = 4;
}

// Trailer summarizing the finished conversion.
message ConvertComplete {
  // Total pages that entered the model queue.
  uint32 pages_started = 1;
  // Pages that produced a PageDocument.
  uint32 pages_ok = 2;
  // Pages that produced a PageRaw (mapping failure or endpoint error).
  uint32 pages_failed = 3;
  // Pages whose model answer ended before the model was done (cut off at
  // max_tokens, content filter, inference error), whichever event they
  // produced: a PageDocument carrying
  // PAGE_WARNING_CODE_GENERATION_TRUNCATED, or a PageRaw whose generation
  // names the stop reason. Each is also counted in pages_ok or
  // pages_failed, so a stream with pages_failed 0 and pages_truncated 2
  // returned two short pages.
  uint32 pages_truncated = 4;
}

// Request for GetServiceInfo. Empty by design.
message GetServiceInfoRequest {}

// Build and capability facts for this server process.
message GetServiceInfoResponse {
  // Semantic version of this server build.
  string version = 1;
  // Configured VLM endpoint as scheme, host and port only, e.g.
  // "http://vlm:8080": a path, query or credentials it carries are never
  // reported. Empty when none is configured.
  string endpoint = 2;
  // Built-in presets the configured endpoint claims to serve.
  repeated VlmPreset presets = 3;
  // Raw model names the configured endpoint claims to serve, beyond the
  // built-in vocabulary.
  repeated string raw_presets = 4;
  // Maximum pages in flight against the VLM per stream.
  uint32 concurrency = 5;
  // Maximum accepted PNG size per page in bytes; larger pages fail with
  // RESOURCE_EXHAUSTED.
  uint64 max_page_bytes = 6;
  // Maximum pages per stream; more pages fail with RESOURCE_EXHAUSTED.
  uint32 max_pages = 7;
  // Frontend advertisement for the shared demo shell.
  UiInfo ui = 8;
  // Response formats this server maps, in enum order. A format missing
  // here fails a ConvertPages stream UNIMPLEMENTED.
  repeated ResponseFormat response_formats = 9;
}

// Frontend advertisement. Same shape in every ai-pipestream grpc service:
// the demo shell reads it to build its tab bar.
message UiInfo {
  // Tab title, e.g. "VLM Convert".
  string title = 1;
  // Shell mount path, e.g. "/ui/vlm-convert".
  string path = 2;
  // One line, used as the tab tooltip.
  string description = 3;
}
